spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  application:
    name: manbanjalbu-be

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/starbucks7th?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    show-sql: ${JPA_SHOW_SQL:true}
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

  security:
    user:
      name: ${SECURITY_USERNAME:admin}
      password: ${SECURITY_PASSWORD:admin}

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          ssl:
            trust: smtp.gmail.com

server:
  port: ${SERVER_PORT:8080}

jwt:
  secret: ${JWT_SECRET:manbanjalbu-local-dev-secret-key-min-256-bits-long!!}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}

member:
  verification:
    expire-minutes: ${MEMBER_VERIFICATION_EXPIRE_MINUTES:5}
    expose-dev-code: ${MEMBER_VERIFICATION_EXPOSE_DEV_CODE:true}
  signup-session:
    expire-minutes: ${MEMBER_SIGNUP_SESSION_EXPIRE_MINUTES:30}

mail:
  verification:
    mock-enabled: ${MAIL_MOCK_ENABLED:false}
    subject: ${MAIL_VERIFICATION_SUBJECT:[스타벅스] 이메일 인증번호}

octomo:
  mock-enabled: ${OCTOMO_MOCK_ENABLED:false}
  api-base-url: ${OCTOMO_API_BASE_URL:https://api.octoverse.kr}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: method
  api-docs:
    path: /v3/api-docs

logging:
  level:
    org.hibernate.SQL: debug
    org.springframework.security: info
